DATASET:
  NAME: ISIC2018
  MODAILTY: Dermatoscope
  IMAGE_INFO:
    TYPE: image
    MODE: RGB
    KEY: null
  MASK_INFO:
    TYPE: npz # strongly recommend to use npz for mask
    MODE: null
    KEY: mask
  FORMAT: yaml # [json, yaml]
  TRAIN: /mnt/f/PatternRecognition/codes/config/datasets/splits/ISIC2018/train.yaml
  VALIDATION: /mnt/f/PatternRecognition/codes/config/datasets/splits/ISIC2018/val.yaml
  TEST: /mnt/f/PatternRecognition/codes/config/datasets/splits/ISIC2018/test.yaml
  NUM_CLASSES: 2
  FOREGROUND_CLASSES: 1  
  INGORE_INDEX: null       
  LABEL:
    0: background
    1: ill
  COLOR:
    0: [0, 0, 0]        # black
    1: [255, 255, 255]  # white
  BATCH_SIZE: 16
  NUM_WORKERS: 4