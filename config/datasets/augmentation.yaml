TASK: "SEGMENTATION" # ["classification", "detection", "segmentation"]

OPERATIONS:
  Resize:
    height: 224
    width: 224
  RandomHorizontalFlip:
    p: 0.5
  RandomVerticalFlip:
    p: 0.0
  Rotate:
    limit: [-90, 90]
    p: 0.0
  RandomBrightnessContrast:
    brightness_limit: [-0.2, 0.2]
    contrast_limit: [-0.2, 0.2]
    p: 0.3
  GaussianBlur:
    blur_limit: [0, 0]
    sigma_limit: [0.5, 3]
    p: 0.0
  GaussNoise:
    std_range: [0.2, 0.5]
    mean_range: [0, 0]
    per_channel: False
    p: 0.0

NORMALIZE:
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  max_pixel_value: 255
  normalization: "standard" # ['standard', 'image', 'image_per_channel', 'min_max', 'min_max_per_channel']
  p: 1.0
TOTENSORV2:
  transpose_mask: False
  p: 1.0

COMPOSE: # 当 TASK == "DETECTION" 时有用
  bbox_params: # 用于目标检测任务
    coord_format: "coco"  # ['coco', 'pascal_voc', 'albumentations', 'yolo', 'cxcywh'] # 边界框的类别
    label_fields: ["labels"] # 用于绑定每个边界框的标签和索引
    bbox_type: "hbb"   # ['hbb', 'obb']
    min_area: 0 # 最小边界框面积 小于这个值将会丢弃
    min_visibility: 0 # 最小可见面积 小于这个值将会丢弃
    min_width: 0 # 最小宽 小于这个值将会丢弃
    min_height: 0 # 最小高 小于这个值将会丢弃
    check_each_transform: True
    filter_invalid_bboxes: False
    max_accept_ratio: NULL
    clip_bboxes_on_input: False
    clip_after_transform: True
  additional_targets: NULL # 用于绑定其他目标的参数 如 additional_targets = {"depth": "image"} 表示将深度图绑定到图像上使用相同的变换