DATASET:
  NAME: BUSI
  MODAILTY: ultrasound
  IMAGE_INFO:
    TYPE: image
    MODE: L
    KEY: null
  MASK_INFO:
    TYPE: npz # strongly recommend to use npz for mask
    MODE: null
    KEY: mask
  FORMAT: yaml # [json, yaml]
  TRAIN: /mnt/f/PatternRecognition/codes/config/datasets/splits/BUSI/train.yaml
  VALIDATION: /mnt/f/PatternRecognition/codes/config/datasets/splits/BUSI/val.yaml
  TEST: /mnt/f/PatternRecognition/codes/config/datasets/splits/BUSI/test.yaml
  NUM_CLASSES: 1
  FOREGROUND_CLASSES: 1  
  INGORE_INDEX: null       
  LABEL:
    0: background
    1: ill
